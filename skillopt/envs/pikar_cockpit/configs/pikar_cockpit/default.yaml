# Pinned SkillOpt 0.2.0 structured config. Deliberately dormant in CI.
# The workflow fetches the active body into skill_init and materializes empty
# train/val/test directories; the loader reads the single scrubbed export via
# SKILLOPT_EXPORT and maps the export's valid partition to val only. No test
# partition is invented. The separate repository golden gate stays independent.
model:
  optimizer: gpt-4o-mini
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: ""

train:
  num_epochs: 1
  train_size: 0
  batch_size: 4
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 2
  merge_batch_size: 2
  analyst_workers: 1
  failure_only: true

optimizer:
  learning_rate: 1
  min_learning_rate: 1
  lr_scheduler: constant
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 4
  test_env_num: 0
  eval_test: false

env:
  name: pikar_cockpit
  skill_init: skillopt/envs/pikar_cockpit/skills/initial.md
  split_mode: split_dir
  split_dir: outputs/skillopt_split
  workers: 2
  max_completion_tokens: 4096
