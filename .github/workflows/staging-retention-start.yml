name: staging-retention-start
"on":
  push:
    branches: [codex/staging-retention-start-20261017]
permissions:
  contents: read
  actions: read
jobs:
  start-retention:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require exact reviewed main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs/39023291826',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error();
            const run=await response.json();
            if(run.head_sha!=='be63035592c7333d04322af40eeb4a3d380244ca'||run.workflow_id!==325088000||run.event!=='push'||run.head_branch!=='main'||run.head_repository.full_name!=='Mrjoel97/ProjectX'||run.status!=='completed'||run.conclusion!=='success')throw Error();
            console.log(JSON.stringify({reviewedCiPassed:true}));
          })().catch(()=>{console.log(JSON.stringify({reviewedCiPassed:false}));process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: be63035592c7333d04322af40eeb4a3d380244ca
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "be63035592c7333d04322af40eeb4a3d380244ca"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start privileged synthetic retention clock
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {randomUUID}=require('node:crypto');
          const run=args=>execFileSync(process.execPath,['node_modules/convex/bin/main.js',...args],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000,maxBuffer:1048576}).trim();
          (async()=>{let phase='target';try{
            if(!process.env.CONVEX_DEPLOY_KEY)throw Error();
            if(run(['dashboard','--no-open']).match(/https:\/\/dashboard\.convex\.dev\/d\/([a-z0-9-]+)/)?.[1]!=='woozy-wren-368')throw Error();
            phase='configuration';
            const names=new Set(run(['env','list','--names-only']).split(/\r?\n/));
            const value=name=>names.has(name)?run(['env','get',name]):undefined;
            if(value('FOUNDATION_ONBOARDING_ENABLED')!=='1'||value('VOICE_SERVER_CONTROL_VERIFIED')==='1')throw Error();
            const {ENV_MANIFEST,missingEnv}=await import('./convex/lib/env.ts');
            const values=new Map(ENV_MANIFEST.filter(s=>s.tier==='fixture').map(s=>[s.name,value(s.name)]));
            if(missingEnv(name=>values.get(name)).fixturesActive.length)throw Error();
            phase='bounded-freshness';
            const prefix='retention-qualification-';
            const freshness=`const tables=["foundationInterviews","foundationTranscripts"];const rows=await Promise.all(tables.map(table=>ctx.db.query(table).take(201)));return {inventoryComplete:rows.every(list=>list.length<=200),prefixAbsent:rows.every(list=>list.every(row=>!row.tenantId.startsWith("retention-qualification-")))};`;
            const before=JSON.parse(run(['run','--inline-query',freshness]));
            if(before.inventoryComplete!==true||before.prefixAbsent!==true)throw Error();
            const tenant=prefix+randomUUID();
            const identity=JSON.stringify({subject:tenant});
            phase='begin';run(['run','foundation:begin','{}','--identity',identity]);
            const checkpoint={eventId:'retention-clock-probe',text:'Synthetic retention clock probe. No business or personal information.',speaker:'user'};
            phase='checkpoint';run(['run','foundation:checkpoint',JSON.stringify(checkpoint),'--identity',identity]);
            const inspect=`const rows=await ctx.db.query("foundationTranscripts").withIndex("by_tenant",q=>q.eq("tenantId",${JSON.stringify(tenant)})).take(2);if(rows.length!==1)return {count:rows.length};return {count:1,createdAt:rows[0]._creationTime,expiresAt:rows[0].expiresAt};`;
            phase='initial-read';const first=JSON.parse(run(['run','--inline-query',inspect]));
            if(first.count!==1||!Number.isFinite(first.createdAt)||!Number.isFinite(first.expiresAt)||Math.abs(first.expiresAt-first.createdAt-604800000)>1)throw Error();
            phase='retry';run(['run','foundation:checkpoint',JSON.stringify(checkpoint),'--identity',identity]);
            const second=JSON.parse(run(['run','--inline-query',inspect]));
            if(JSON.stringify(second)!==JSON.stringify(first))throw Error();
            console.log(JSON.stringify({privilegedSyntheticStart:true,nativeOnboardingVerified:false,inventoryComplete:true,transcriptCount:1,createdAt:new Date(first.createdAt).toISOString(),expiresAt:new Date(first.expiresAt).toISOString(),ttlSevenDays:true,retryPreservedExpiry:true,elapsedRetentionVerified:false}));
          }catch{console.log(JSON.stringify({retentionStartVerified:false,phase}));process.exitCode=1;}})();
          NODE
