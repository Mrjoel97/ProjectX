# ci — the enforced typecheck / lint / test / build gate (Phase 22.1 SC3).
#
# Before this file existed, "typecheck is at the exact 150 baseline" was a number a human carried
# between sessions and compared by eye. That works for one contributor on one machine and fails the
# moment it matters. This workflow is the machine that carries it instead.
#
# Convex's generated API/DataModel types are committed. The Convex CLI explicitly recommends this,
# and it keeps this verification job hermetic: codegen contacts a deployment and therefore cannot
# be the bootstrap step for pull requests or forks that do not have deployment credentials.
#
# Repository variables:
#   NEXT_PUBLIC_CONVEX_URL — optional; `next build` bakes it into the client bundle when configured

name: ci

permissions:
  contents: read

# Quoted so YAML keeps the string key `on` (unquoted `on` parses to boolean true) — matches skillopt.yml.
"on":
  push:
    branches: [main]
  pull_request:

# One run per ref. A superseded push is cancelled rather than queued — the only run that matters is
# the one for the current tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4

      # corepack before setup-node so `cache: pnpm` can find the pnpm binary pinned by
      # packageManager in the root package.json.
      - name: Enable corepack (pins pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `biome ci` = formatter + organizeImports + linter, no writes. Errors block; warnings do not.
      # Do NOT add --error-on-warnings: 134 pre-existing noNonNullAssertion warnings would redden the
      # gate on day one and the pressure would be to weaken the rule set rather than fix anything.
      - name: Lint
        # Report only blocking diagnostics so the warning baseline cannot exhaust Biome's default
        # diagnostic cap and hide the errors that actually reddened the job.
        run: pnpm lint --diagnostic-level=error --max-diagnostics=none

      # Unit tests only (vitest). apps/web's Playwright suite is `test:e2e` and is deliberately NOT
      # part of this gate — it needs a live deployment and a seeded tenant.
      # THE FREE GATES. Seventeen scripts carry an offline `--self-test` / `--self-check` mode, and
      # until 2026-09-09 nothing ran them: two were found red BY ACCIDENT, one of them stale since
      # 35-02. A gate nobody runs is indistinguishable from a gate that passes, and a gate that sits
      # red for a non-reason stops being read — taking the real failures with it. Offline and free,
      # so this costs the job seconds and needs no deployment.
      #
      # Its own `--self-test` runs FIRST, and deliberately as a separate command: a runner that
      # cannot fail would report seventeen green gates whatever they said.
      - name: Free gates
        run: |
          node scripts/check-free-gates.mjs --self-test
          node scripts/check-free-gates.mjs

      - name: Test
        run: pnpm test

      # The deployment half of SC3: prove the artifact a deploy would ship actually builds. Actual
      # Vercel deployment automation belongs to Phase 25, which owns the custom-domain/deploy call.
      - name: Build
        run: pnpm build
