name: staging-previous-strict-dryrun
"on":
  push:
    branches: [codex/staging-previous-dryrun-20261017]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: operator
          persist-credentials: false
      - name: Check operator syntax and diagnostic allowlist without credentials
        run: |
          node --check operator/.github/scripts/staging-previous-dryrun.mjs
          node operator/.github/scripts/staging-previous-dryrun.mjs self-check
      - name: Require successful CI for exact previous source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs/38815049837',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error();const run=await response.json();
            if(run.head_sha!=='de18285d7466ea743d42199dc1d8de4a66dccbf9'||run.workflow_id!==325088000||run.event!=='push'||run.head_repository.full_name!=='Mrjoel97/ProjectX'||run.status!=='completed'||run.conclusion!=='success')throw Error();
            console.log(JSON.stringify({exactPreviousCiPassed:true}));
          })().catch(()=>{console.log(JSON.stringify({exactPreviousCiPassed:false}));process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: de18285d7466ea743d42199dc1d8de4a66dccbf9
          path: previous
          persist-credentials: false
      - run: corepack enable
      - name: Frozen installation without deployment credentials
        working-directory: previous
        run: pnpm install --frozen-lockfile
      - name: Observe staging before and after strict dry-run only
        timeout-minutes: 18
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: node operator/.github/scripts/staging-previous-dryrun.mjs
