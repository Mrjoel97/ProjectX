name: native-ingest-readonly-diagnostic
on:
  push:
    branches: [codex/native-ingest-diagnostic-20261017]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: operator
          persist-credentials: false
      - name: Verify observer source
        env:
          OPERATOR_SHA: ${{ github.sha }}
        run: |
          test "$(git -C operator rev-parse HEAD)" = "$OPERATOR_SHA"
          node --check operator/.github/scripts/native-ingest-diagnostic.mjs
      - name: Require exact backend CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{const r=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs/39034001288',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const x=await r.json();if(x.head_sha!=='b2dfecaa512b5b2bdf34189dcc3a09b9ff4cc41c'||x.workflow_id!==325088000||x.name!=='ci'||x.path!=='.github/workflows/ci.yml'||x.status!=='completed'||!['pull_request','push'].includes(x.event)||x.head_repository.full_name!=='Mrjoel97/ProjectX'||x.repository.full_name!=='Mrjoel97/ProjectX'||x.conclusion!=='success')throw Error();const latestResponse=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/workflows/325088000/runs?head_sha=b2dfecaa512b5b2bdf34189dcc3a09b9ff4cc41c&per_page=10',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});if(!latestResponse.ok)throw Error();const latest=(await latestResponse.json()).workflow_runs.filter(r=>r.head_sha==='b2dfecaa512b5b2bdf34189dcc3a09b9ff4cc41c'&&['pull_request','push'].includes(r.event)).sort((a,b)=>b.id-a.id)[0];if(!latest||latest.id!==x.id||latest.status!=='completed'||latest.conclusion!=='success')throw Error();console.log(JSON.stringify({exactBackendCiPassed:true,latestExactHeadCiPassed:true}));})().catch(()=>{console.error('CI_GATE_FAILED');process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: b2dfecaa512b5b2bdf34189dcc3a09b9ff4cc41c
          path: release
          persist-credentials: false
      - name: Verify release source
        run: test "$(git -C release rev-parse HEAD)" = "b2dfecaa512b5b2bdf34189dcc3a09b9ff4cc41c"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: release
      - name: Diagnose exact failed native ingest read only
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: node operator/.github/scripts/native-ingest-diagnostic.mjs
