name: staging-native-regression-signup
on:
  push:
    branches: [codex/staging-native-regression-signup-20261017]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.repository == 'Mrjoel97/ProjectX'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    env:
      SOURCE_SHA: b2dfecaa512b5b2bdf34189dcc3a09b9ff4cc41c
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require exact successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const sha=process.env.SOURCE_SHA;
            if(!/^[a-f0-9]{40}$/.test(sha))throw Error();
            const r=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs?head_sha='+sha+'&per_page=30',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error();
            const runs=(await r.json()).workflow_runs.filter(x=>x.head_sha===sha&&x.path==='.github/workflows/ci.yml'&&x.workflow_id===325088000&&x.repository.full_name==='Mrjoel97/ProjectX'&&x.head_repository?.full_name==='Mrjoel97/ProjectX').sort((a,b)=>b.id-a.id);
            if(runs[0]?.status!=='completed'||runs[0]?.conclusion!=='success')throw Error();
            console.log('Exact source CI verified');
          })().catch(()=>{console.error('SOURCE_CI_NOT_VERIFIED');process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/backend/scripts/nativeSignupProbe.test.mjs
      - name: Isolated native staging signup probe
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
          NATIVE_SIGNUP_TRANSPORT_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwuFJG+9R/9HG0NvOPNqA
            yy3uKbryu1usgiTmo1MxYI1h+/F5EP2l6uZCyhpi/D5k29gae74cthDOodp1mh4S
            o14KfcB4IbN9r/polzymnfR64Mgsm/2H0nXWkW5aylgmfAng6mHNBco6byDQb3Lq
            rbhjfKSosJXzFrnhPXACEr/ES1vKKxjF2raJZTB7aeOVJ1qrGZFTe4F0HiqbWir6
            ockdxqFH/N11ndO0/72DAKBndm88YuX6y+eVd5BLziIo98jS0/EwyaR8kvAIZSCT
            rjnD/V10CoC6BeGYcrIiR3cz0XbupQI2hugn89lojABOcojMRZCJqaHxCLJ0BQJI
            Zj3GerhFDofd8yiWwCGP8g0/RQrU93xq0OyHLJ0fsLn9WcEfUGzjA/rtClyumFZa
            yZyc7AbxFpaVJd+zu5btiOe9zIBRhO07r3Y/EkH4tC7gpsSClGYAJU/BWBwX+PB5
            ScIt4kvFW9zK0ecID8lUr23cdU4DZ32n5aAPKqeRXjUnx1XAJplAIBPyCgbMOSJH
            FzBy9nZiTB/5YOd1r4i6+Kfn1F8MB3VGCR/aYsCOC1JUQqglybPfn9+aavvw6ODF
            VJuDYcEkR4OY3eKJbMspF/nhX7ihULuyLbJDxccKeWXQ+c/oKCllDCrAqxeBYS4k
            C6Icq8BMrJF3tX/VwdgOsw8CAwEAAQ==
            -----END PUBLIC KEY-----
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {resolve} from 'node:path';
          import {ENV_MANIFEST,missingEnv} from './packages/backend/convex/lib/env.ts';
          try {
            const backend=resolve('packages/backend');
            const cli=(args)=>execFileSync(process.execPath,[resolve(backend,'node_modules/convex/bin/main.js'),...args],{cwd:backend,encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000,maxBuffer:1048576}).trim();
            if(cli(['dashboard','--no-open'])!=='https://dashboard.convex.dev/d/woozy-wren-368')throw Error();
            const names=new Set(cli(['env','list','--names-only']).split(/\r?\n/));
            const read=(name)=>names.has(name)?cli(['env','get',name]):undefined;
            const fixtures=new Map(ENV_MANIFEST.filter(x=>x.tier==='fixture').map(x=>[x.name,read(x.name)]));
            if(missingEnv(name=>fixtures.get(name)).fixturesActive.length)throw Error();
            if(!process.env.NATIVE_SIGNUP_TRANSPORT_PUBLIC_KEY?.trim())throw Error();
            if(read('VOICE_SERVER_CONTROL_VERIFIED')==='1')throw Error();
            if(read('SITE_URL')!=='https://pikar-ai-convex-gpbrsadzc-joelferuzi-gmailcoms-projects.vercel.app')throw Error();
            if(!names.has('FOUNDATION_ONBOARDING_ENABLED')||cli(['env','get','FOUNDATION_ONBOARDING_ENABLED'])!=='1')throw Error();
            console.log(JSON.stringify({stagingVerified:true,fixtureFlagsDisabled:true,foundationRestored:true,voiceDisabled:true,authOriginUnchanged:true,publicKeyPresent:true}));
          } catch {
            console.error('STAGING_NATIVE_PROBE_PREFLIGHT_REFUSED');process.exitCode=1;
          }
          NODE
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {resolve} from 'node:path';
          import {createRequire} from 'node:module';
          import {probeSignup} from './packages/backend/scripts/nativeSignupProbe.mjs';
          const require=createRequire(resolve('packages/backend/package.json'));
          const {ConvexHttpClient}=require('convex/browser');
          const {makeFunctionReference}=require('convex/server');
          const origin='https://pikar-ai-convex-gpbrsadzc-joelferuzi-gmailcoms-projects.vercel.app';
          const client=new ConvexHttpClient('https://woozy-wren-368.convex.cloud',{logger:false});
          const backend=resolve('packages/backend');
          const cli=args=>execFileSync(process.execPath,[resolve(backend,'node_modules/convex/bin/main.js'),...args],{cwd:backend,encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000,maxBuffer:1048576});
          const result=await probeSignup({cli,publicKey:process.env.NATIVE_SIGNUP_TRANSPORT_PUBLIC_KEY,client:{
            query:(name,args)=>client.query(makeFunctionReference(name),args),
            action:async(name,args)=>{
              if(name!=='auth:signIn')throw Error('UNEXPECTED_ACTION');
              const response=await fetch(origin+'/api/auth',{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({action:name,args}),redirect:'error',signal:AbortSignal.timeout(60000)});
              if(response.status!==200)throw Error('WEB_AUTH_REFUSED');
              return response.json();
            }
          }});
          console.log(JSON.stringify({...result,webAuthProxySignup:result.success===true,browserAcceptance:false}));
          if(!result.success)process.exitCode=1;
          NODE
