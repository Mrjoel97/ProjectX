name: staging-voice-transport
"on":
  push:
    branches: [codex/staging-voice-transport-20261017]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require exact reviewed CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs/39025462441',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error();
            const run=await response.json();
            if(run.head_sha!=='3d877c6e8dedc80ebb6bac552c024a5703a16101'||run.workflow_id!==325088000||run.event!=='pull_request'||run.head_repository.full_name!=='Mrjoel97/ProjectX'||run.status!=='completed'||run.conclusion!=='success')throw Error();
            console.log(JSON.stringify({reviewedCiPassed:true}));
          })().catch(()=>{console.log(JSON.stringify({reviewedCiPassed:false}));process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: 3d877c6e8dedc80ebb6bac552c024a5703a16101
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "3d877c6e8dedc80ebb6bac552c024a5703a16101"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium before credentials
        working-directory: apps/web
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: One controlled staging transport call
        working-directory: packages/backend
        timeout-minutes: 4
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: |
          node <<'NODE'
          const {execFileSync,fork}=require('node:child_process');
          const {writeFileSync,renameSync}=require('node:fs');
          const {join,resolve}=require('node:path');
          const {randomUUID}=require('node:crypto');
          const run=args=>execFileSync(process.execPath,['node_modules/convex/bin/main.js',...args],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:60000,maxBuffer:1048576}).trim();
          const query=source=>JSON.parse(run(['run','--inline-query',source]));
          const statePath=join(process.env.RUNNER_TEMP,'voice-transport-private.json');
          let phase='guard',child,state;
          const save=()=>{const temporary=statePath+'.next';writeFileSync(temporary,JSON.stringify(state),{mode:0o600});renameSync(temporary,statePath);};
          (async()=>{try{
            if(!process.env.CONVEX_DEPLOY_KEY||run(['dashboard','--no-open']).match(/https:\/\/dashboard\.convex\.dev\/d\/([a-z0-9-]+)/)?.[1]!=='woozy-wren-368')throw Error();
            const names=new Set(run(['env','list','--names-only']).split(/\r?\n/));
            const value=name=>names.has(name)?run(['env','get',name]):null;
            if(!names.has('OPENAI_API_KEY'))throw Error();
            const prior=value('VOICE_SERVER_CONTROL_VERIFIED');if(prior!==null&&prior!=='0'&&prior!=='false')throw Error();
            const deploymentBudget=value('DEPLOYMENT_BUDGET_CENTS');
            if(deploymentBudget!==null&&(!/^\d+$/.test(deploymentBudget)||Number(deploymentBudget)<184||Number(deploymentBudget)>5000))throw Error();
            const {ENV_MANIFEST,missingEnv}=await import('./convex/lib/env.ts');
            const fixtures=new Map(ENV_MANIFEST.filter(x=>x.tier==='fixture').map(x=>[x.name,value(x.name)]));
            if(missingEnv(name=>fixtures.get(name)??undefined).fixturesActive.length)throw Error();
            if(query('const rows=await ctx.db.query("voiceSessions").take(201);const config=await ctx.db.query("guardrailConfig").first();const skill=await ctx.db.query("skills").withIndex("by_name_status",q=>q.eq("name","voice-session").eq("status","active")).unique();return rows.length<=200&&rows.every(s=>s.status!=="active"&&!s.tenantId.startsWith("voice-transport-qualification-"))&&!config?.killSwitch&&skill!==null;')!==true)throw Error();
            if(query('return (await ctx.db.query("spendEvents").withIndex("by_tenant",q=>q.gte("tenantId","voice-transport-qualification-").lt("tenantId","voice-transport-qualification-\\uffff")).take(1)).length===0;')!==true)throw Error();
            const tenant='voice-transport-qualification-'+randomUUID();
            const tenantLiteral=JSON.stringify(tenant);
            if(query('return (await ctx.db.query("spendEvents").withIndex("by_tenant",q=>q.eq("tenantId",'+tenantLiteral+')).take(1)).length===0;')!==true)throw Error();
            const available=JSON.parse(run(['run','guardrails:remainingDailyCents',JSON.stringify({tenantId:tenant})]));
            if(!Number.isFinite(available)||available<184||available>500)throw Error();
            state={tenant,prior,activationAttempted:false,connectAttempted:false,sessionId:null};save();
            const browserSource=`const {chromium}=require(require('node:path').resolve(process.cwd(),'node_modules/@playwright/test'));let browser;const stop=async()=>{await browser?.close();process.exit(0)};process.on('message',async m=>{try{if(m.kind==='answer'){await page.evaluate(sdp=>window.peer.setRemoteDescription({type:'answer',sdp}),m.sdp);process.send({kind:'applied'});}else if(m.kind==='stats'){const result=await page.evaluate(async()=>{const stats=await window.peer.getStats();return {connected:window.peer.connectionState==='connected',receivedAudio:[...stats.values()].some(s=>s.type==='inbound-rtp'&&s.kind==='audio'&&s.packetsReceived>0)};});process.send({kind:'stats',...result});}else if(m.kind==='stop')await stop();}catch{process.send({kind:'failed'});}});let page;(async()=>{browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});page=await browser.newPage();await page.goto('about:blank');const sdp=await page.evaluate(async()=>{const audio=new AudioContext();await audio.resume();const oscillator=audio.createOscillator();const gain=audio.createGain();gain.gain.value=0;const dest=audio.createMediaStreamDestination();oscillator.connect(gain).connect(dest);oscillator.start();const pc=new RTCPeerConnection();window.peer=pc;const track=dest.stream.getAudioTracks()[0];pc.addTrack(track,dest.stream);const opus=RTCRtpSender.getCapabilities('audio').codecs.filter(c=>c.mimeType.toLowerCase()==='audio/opus');if(opus.length!==1)throw Error();pc.getTransceivers()[0].setCodecPreferences(opus);const offer=await pc.createOffer();await pc.setLocalDescription(offer);return offer.sdp;});process.send({kind:'offer',sdp});})().catch(()=>process.send({kind:'failed'}));setTimeout(stop,100000);`;
            const browserPath=join(process.env.RUNNER_TEMP,'voice-browser.cjs');writeFileSync(browserPath,browserSource,{mode:0o600});
            const safeEnv={};for(const name of ['PATH','HOME','TMPDIR','XDG_CACHE_HOME','PLAYWRIGHT_BROWSERS_PATH','LANG'])if(process.env[name])safeEnv[name]=process.env[name];
            child=fork(browserPath,[],{cwd:resolve('../../apps/web'),env:safeEnv,stdio:['ignore','pipe','pipe','ipc']});
            child.stdout.resume();child.stderr.resume();
            const messages=[];child.on('message',m=>messages.push(m));
            const deadline=Date.now()+90000;
            const receive=async kind=>{while(Date.now()<deadline){const fail=messages.find(m=>m.kind==='failed');if(fail||child.exitCode!==null)throw Error();const index=messages.findIndex(m=>m.kind===kind);if(index>=0)return messages.splice(index,1)[0];await new Promise(r=>setTimeout(r,100));}throw Error();};
            phase='browser-offer';const offer=await receive('offer');
            if(typeof offer.sdp!=='string'||offer.sdp.length>32768||/m=application|sctp/i.test(offer.sdp))throw Error();
            phase='activate';state.activationAttempted=true;save();run(['env','set','VOICE_SERVER_CONTROL_VERIFIED','1']);
            phase='connect';state.connectAttempted=true;save();const identity=JSON.stringify({subject:tenant});const connected=JSON.parse(run(['run','voiceToken:connect',JSON.stringify({offerSdp:offer.sdp}),'--identity',identity]));
            state.sessionId=connected.sessionId;save();child.send({kind:'answer',sdp:connected.answerSdp});await receive('applied');
            phase='single-turn';run(['run','voice:sendText',JSON.stringify({sessionId:state.sessionId,text:'Please say hello once. This is a synthetic transport check.'}),'--identity',identity]);
            const inspect='const s=await ctx.db.get('+JSON.stringify(state.sessionId)+');return {ready:!!s?.controlReady,trusted:(s?.trustedResponseIds?.length??0)>0};';
            let proof;
            phase='trusted-receipt';while(Date.now()<deadline){proof=query(inspect);if(proof.trusted)break;await new Promise(r=>setTimeout(r,1000));}if(!proof?.ready||!proof?.trusted)throw Error();
            child.send({kind:'stats'});const stats=await receive('stats');if(!stats.connected||!stats.receivedAudio)throw Error();
            state.transportPassed=true;save();
            console.log(JSON.stringify({privilegedSyntheticTransport:true,nativeAcceptance:false,toolFree:true,controlReady:true,trustedUsageObserved:true,connected:true,receivedAudio:true}));
          }catch{console.log(JSON.stringify({transportPassed:false,phase}));process.exitCode=1;}finally{
            if(state?.sessionId)try{run(['run','voice:endSessionClean',JSON.stringify({sessionId:state.sessionId}),'--identity',JSON.stringify({subject:state.tenant})]);}catch{console.log(JSON.stringify({immediateEndRequested:false}));}
            if(child){try{child.send({kind:'stop'});}catch{}setTimeout(()=>child.kill(),2000).unref();}
          }})();
          NODE
      - name: Always restore staging flag then terminate own call
        if: always()
        working-directory: packages/backend
        timeout-minutes: 4
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');const {readFileSync,existsSync}=require('node:fs');const {join}=require('node:path');
          const run=args=>execFileSync(process.execPath,['node_modules/convex/bin/main.js',...args],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:30000,maxBuffer:1048576}).trim();
          const query=source=>JSON.parse(run(['run','--inline-query',source]));
          const path=join(process.env.RUNNER_TEMP,'voice-transport-private.json');
          (async()=>{if(!existsSync(path)){console.log(JSON.stringify({activationAttempted:false}));return;}let terminated=false,restored=false,ledgerVerified=false;const state=JSON.parse(readFileSync(path,'utf8'));try{
            if(run(['dashboard','--no-open']).match(/https:\/\/dashboard\.convex\.dev\/d\/([a-z0-9-]+)/)?.[1]!=='woozy-wren-368')throw Error();
            const readFlag=()=>{const names=new Set(run(['env','list','--names-only']).split(/\r?\n/));return names.has('VOICE_SERVER_CONTROL_VERIFIED')?run(['env','get','VOICE_SERVER_CONTROL_VERIFIED']):null;};
            // Close global staging admission before waiting on any provider termination.
            try{
              if(readFlag()!==state.prior){if(state.prior===null)run(['env','remove','VOICE_SERVER_CONTROL_VERIFIED']);else run(['env','set','VOICE_SERVER_CONTROL_VERIFIED',state.prior]);}
              restored=readFlag()===state.prior;
            }catch{console.log(JSON.stringify({originalFlagRestored:false}));}
            const tenantLiteral=JSON.stringify(state.tenant);
            for(let i=0;i<30;i++){
              // Re-read every time: connect can finish remotely after its CLI timed out.
              const rows=query('return (await ctx.db.query("voiceSessions").withIndex("by_tenant",q=>q.eq("tenantId",'+tenantLiteral+')).take(2)).map(s=>({_id:s._id,status:s.status,hangupConfirmed:typeof s.hangupConfirmedAt==="number"}));');
              if(rows.length>1)throw Error();
              if(rows.length===0&&!state.connectAttempted){terminated=true;break;}
              if(rows.length===1&&rows[0].status!=="active"&&rows[0].hangupConfirmed){terminated=true;break;}
              for(const row of rows)if(row.status==='active')run(['run','voice:endSessionClean',JSON.stringify({sessionId:row._id}),'--identity',JSON.stringify({subject:state.tenant})]);
              await new Promise(r=>setTimeout(r,1000));
            }
            if(terminated&&state.connectAttempted){
              const proof=query(`const sessions=await ctx.db.query("voiceSessions").withIndex("by_tenant",q=>q.eq("tenantId",${tenantLiteral})).take(2);
              const rows=await ctx.db.query("spendEvents").withIndex("by_tenant",q=>q.eq("tenantId",${tenantLiteral})).take(21);
              if(sessions.length!==1||rows.length>20)return {ledgerVerified:false};
              const session=sessions[0],reserved=rows.filter(r=>r.phase==="reserved"),actual=rows.filter(r=>r.phase==="actual");
              const initial=reserved.find(r=>r._id===session.spendReservationId),response=reserved.find(r=>r._id!==session.spendReservationId);
              const initialHoldRetained=!!initial&&initial.amountCents===100&&rows.every(r=>r.correlationId!==initial.correlationId||r.phase==="reserved");
              const responseSettled=!!response&&response.amountCents===84&&actual.length===1&&actual[0].correlationId===response.correlationId&&actual[0].amountCents>0&&actual[0].amountCents<=84;
              return {ledgerVerified:reserved.length===2&&rows.every(r=>r.kind==="paid_call")&&initialHoldRetained&&responseSettled&&(session.trustedResponseIds?.length??0)===1,ledgerComplete:true,reservationCount:reserved.length,admittedCents:reserved.reduce((n,r)=>n+r.amountCents,0),actualCount:actual.length,actualCents:actual.reduce((n,r)=>n+r.amountCents,0),trustedResponseCount:session.trustedResponseIds?.length??0,initialHoldRetained};`);
              const allowed=['ledgerVerified','ledgerComplete','reservationCount','admittedCents','actualCount','actualCents','trustedResponseCount','initialHoldRetained'];
              if(Object.keys(proof).some(key=>!allowed.includes(key))||Object.values(proof).some(v=>typeof v!=='boolean'&&typeof v!=='number'))throw Error();
              console.log(JSON.stringify(proof));ledgerVerified=proof.ledgerVerified===true;
            }
          }catch{}console.log(JSON.stringify({providerTerminationConfirmed:terminated,originalFlagRestored:restored,ledgerVerified,nativeAcceptance:false}));if(!terminated||!restored||!ledgerVerified)process.exitCode=1;})().catch(()=>{console.log(JSON.stringify({cleanupCompleted:false}));process.exitCode=1;});
          NODE
