name: native-privacy-readonly-observer
on:
  push:
    branches: [codex/native-privacy-observer-20261017]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: operator
          persist-credentials: false
      - name: Verify observer source
        env:
          OPERATOR_SHA: ${{ github.sha }}
        run: |
          test "$(git -C operator rev-parse HEAD)" = "$OPERATOR_SHA"
          node --check operator/.github/scripts/native-privacy-observer.mjs
      - name: Require exact backend CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{const r=await fetch('https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs/39025828381',{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const x=await r.json();if(x.head_sha!=='a129b884445482625b1e8f2a236744fb2a0f2515'||x.workflow_id!==325088000||x.name!=='ci'||x.event!=='push'||x.repository.full_name!=='Mrjoel97/ProjectX'||x.conclusion!=='success')throw Error();console.log(JSON.stringify({exactBackendCiPassed:true}));})().catch(()=>{console.error('CI_GATE_FAILED');process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: a129b884445482625b1e8f2a236744fb2a0f2515
          path: release
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: release
      - name: Capture exact fresh native fixture references privately
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: node operator/.github/scripts/native-privacy-observer.mjs capture
      - name: Wait for local native erasure and verify physical absence
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: node operator/.github/scripts/native-privacy-observer.mjs verify
