name: SkillOpt offline contract

# No deployment credentials, export, trainer, model or provider calls.
"on":
  push:
    paths:
      - "skillopt/**"
      - ".github/workflows/skillopt.yml"
      - ".github/workflows/skillopt-contract.yml"
  pull_request:
    paths:
      - "skillopt/**"
      - ".github/workflows/skillopt.yml"
      - ".github/workflows/skillopt-contract.yml"
  workflow_dispatch: {}

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned SkillOpt
        run: python -m pip install -r skillopt/requirements.txt
      - name: Verify local adapter against installed package, offline
        run: python -m unittest discover -s skillopt/tests -p 'test_*.py' -v
