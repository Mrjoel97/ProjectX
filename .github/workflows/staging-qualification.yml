name: staging-qualification
"on":
  push:
    branches: [codex/staging-qualification-20261015]
permissions:
  contents: read
  actions: read
jobs:
  drain-preflight:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require successful CI for the pinned source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const sha="118b8e73a4e4e9dbb4164cdd57724e0ec799bec4";
          (async()=>{for(let attempt=0;attempt<60;attempt++){
            const response=await fetch("https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs?head_sha="+sha+"&per_page=20",{headers:{Authorization:"Bearer "+process.env.GITHUB_TOKEN,Accept:"application/vnd.github+json"},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error("CI status unavailable");
            const runs=(await response.json()).workflow_runs.filter(r=>r.name==="ci"&&r.head_sha===sha);
            if(runs.some(r=>r.status==="completed"&&r.conclusion==="success")){console.log("Pinned source CI passed.");return;}
            if(runs.some(r=>r.status==="completed"&&["failure","timed_out"].includes(r.conclusion)))throw Error("Pinned source CI failed");
            await new Promise(resolve=>setTimeout(resolve,15000));
          }throw Error("Pinned source CI did not finish in the bounded window");})().catch(()=>{console.error("Pinned source CI gate did not pass.");process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: 118b8e73a4e4e9dbb4164cdd57724e0ec799bec4
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Inspect bounded staging workflow inventory and ingestion queues
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: |
          node <<'NODE'
          const {execFileSync}=require("node:child_process");
          const run=args=>execFileSync(process.execPath,["node_modules/convex/bin/main.js",...args],{encoding:"utf8",stdio:["ignore","pipe","pipe"],timeout:30000,maxBuffer:4194304}).trim();
          const decode=text=>text?JSON.parse(text):null;
          const query=(source,component)=>decode(run(["run","--inline-query",source,"--component",component]));
          (async()=>{try{
            if(run(["dashboard","--no-open"]).match(/https:\/\/dashboard\.convex\.dev\/d\/([a-z0-9-]+)/)?.[1]!=="woozy-wren-368")throw Error();
            const result={stagingTarget:true,inventoryComplete:false,workflowRecords:0,unfinishedWorkflows:0,unfinishedIngestion:0,unguardedIngestion:0,poolsQuietTwice:false};
            let cursor=null;const cursors=new Set();
            for(let page=0;page<20;page++){
              const data=decode(run(["run","workflow:list",JSON.stringify({order:"asc",paginationOpts:{numItems:100,cursor}}),"--component","workflow"]));
              if(!Array.isArray(data?.page)||data.page.length>100)throw Error();
              for(const row of data.page){
                result.workflowRecords++;
                if(row.runResult===undefined){
                  result.unfinishedWorkflows++;
                  const args=row.args??{};
                  if(String(row.name??"").includes("vaultIngest")||typeof args.vaultDocId==="string"){
                    result.unfinishedIngestion++;
                    if(typeof args.expectedContentHash!=="string"||!args.expectedContentHash||row.context?.expectedContentHash!==args.expectedContentHash)result.unguardedIngestion++;
                  }
                }
              }
              if(data.isDone===true){result.inventoryComplete=true;break;}
              if(typeof data.continueCursor!=="string"||cursors.has(data.continueCursor))throw Error();
              cursors.add(data.continueCursor);cursor=data.continueCursor;
            }
            if(!result.inventoryComplete)throw Error();
            let quiet=true;
            const source='const workEmpty=(await ctx.db.query("work").first())===null;const state=await ctx.db.query("internalState").first();return {workEmpty,runningEmpty:state===null?workEmpty:Array.isArray(state.running)&&state.running.length===0};';
            for(let pass=0;pass<2;pass++){
              for(const component of ["workflow/workpool","vaultIngestPool"]){
                const state=query(source,component);quiet=quiet&&state.workEmpty===true&&state.runningEmpty===true;
              }
              if(pass===0)await new Promise(resolve=>setTimeout(resolve,2000));
            }
            result.poolsQuietTwice=quiet;
            console.log(JSON.stringify(result));
            if(!quiet||result.unfinishedIngestion||result.unguardedIngestion)process.exitCode=1;
          }catch{console.error('{"stagingDrainInspectionCompleted":false}');process.exitCode=1;}})();
          NODE
