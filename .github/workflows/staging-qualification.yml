name: staging-qualification
"on":
  push:
    branches: [codex/staging-qualification-20261015]
permissions:
  contents: read
  actions: read
jobs:
  foundation-gates:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require successful CI for the pinned source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const sha="118b8e73a4e4e9dbb4164cdd57724e0ec799bec4";
          (async()=>{for(let attempt=0;attempt<60;attempt++){
            const response=await fetch("https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs?head_sha="+sha+"&per_page=20",{headers:{Authorization:"Bearer "+process.env.GITHUB_TOKEN,Accept:"application/vnd.github+json"},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error("CI status unavailable");
            const runs=(await response.json()).workflow_runs.filter(r=>r.name==="ci"&&r.head_sha===sha);
            if(runs.some(r=>r.status==="completed"&&r.conclusion==="success")){console.log("Pinned source CI passed.");return;}
            if(runs.some(r=>r.status==="completed"&&["failure","timed_out"].includes(r.conclusion)))throw Error("Pinned source CI failed");
            await new Promise(resolve=>setTimeout(resolve,15000));
          }throw Error("Pinned source CI did not finish in the bounded window");})().catch(()=>{console.error("Pinned source CI gate did not pass.");process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: 118b8e73a4e4e9dbb4164cdd57724e0ec799bec4
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify disabled foundation RPCs without content writes or paid calls
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: |
          node <<'NODE'
          const {execFileSync}=require("node:child_process"),{randomBytes}=require("node:crypto");
          const run=args=>execFileSync(process.execPath,["node_modules/convex/bin/main.js",...args],{encoding:"utf8",stdio:["ignore","pipe","pipe"],timeout:30000}).trim();
          const decode=text=>text?JSON.parse(text):null;
          const evidence={stagingTarget:false,syntheticAdminContext:true,foundationFlagOff:false,beginRefused:false,paidAnswerRefused:false,publishRefused:false,noDraftCreated:false};
          try{
            const target=run(["dashboard","--no-open"]).match(/https:\/\/dashboard\.convex\.dev\/d\/([a-z0-9-]+)/)?.[1];
            if(target!=="woozy-wren-368")throw Error();
            evidence.stagingTarget=true;
            const tenant="packeval-"+randomBytes(4).toString("hex")+"-foundation-disabled";
            const identity=JSON.stringify({subject:tenant});
            const call=(fn,args)=>decode(run(["run",fn,JSON.stringify(args),"--identity",identity]));
            if(call("foundation:enabled",{})!==false||call("foundation:get",{})!==null)throw Error();
            evidence.foundationFlagOff=true;
            for(const [fn,args,key] of [
              ["foundation:begin",{},"beginRefused"],
              ["foundation:answer",{revision:0,eventId:"disabled-probe",answer:"Synthetic flag-gate check",section:"essentials",intent:"current"},"paidAnswerRefused"],
              ["foundation:publish",{revision:0,reviewHash:"0".repeat(64)},"publishRefused"]
            ]){
              let refused=false;
              try{call(fn,args);}catch(error){refused=[error.stdout,error.stderr].some(value=>String(value??"").includes("FOUNDATION_ONBOARDING_DISABLED"));}
              if(!refused)throw Error();
              evidence[key]=true;
            }
            evidence.noDraftCreated=call("foundation:get",{})===null;
            if(!evidence.noDraftCreated)throw Error();
          }catch{process.exitCode=1;}
          console.log(JSON.stringify(evidence));
          NODE
