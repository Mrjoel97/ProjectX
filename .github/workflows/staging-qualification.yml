name: staging-qualification
"on":
  push:
    branches: [codex/staging-qualification-20261015]
permissions:
  contents: read
  actions: read
jobs:
  foundation-readiness:
    if: github.repository == 'Mrjoel97/ProjectX'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: staging-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require successful CI for the pinned source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const sha="118b8e73a4e4e9dbb4164cdd57724e0ec799bec4";
          (async()=>{for(let attempt=0;attempt<60;attempt++){
            const response=await fetch("https://api.github.com/repos/Mrjoel97/ProjectX/actions/runs?head_sha="+sha+"&per_page=20",{headers:{Authorization:"Bearer "+process.env.GITHUB_TOKEN,Accept:"application/vnd.github+json"},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error("CI status unavailable");
            const runs=(await response.json()).workflow_runs.filter(r=>r.name==="ci"&&r.head_sha===sha);
            if(runs.some(r=>r.status==="completed"&&r.conclusion==="success")){console.log("Pinned source CI passed.");return;}
            if(runs.some(r=>r.status==="completed"&&["failure","timed_out"].includes(r.conclusion)))throw Error("Pinned source CI failed");
            await new Promise(resolve=>setTimeout(resolve,15000));
          }throw Error("Pinned source CI did not finish in the bounded window");})().catch(()=>{console.error("Pinned source CI gate did not pass.");process.exitCode=1;});
          NODE
      - uses: actions/checkout@v4
        with:
          ref: 118b8e73a4e4e9dbb4164cdd57724e0ec799bec4
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate staging prerequisites and enable typed foundation qualification
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.STAGING_CONVEX_DEPLOY_KEY }}
        run: |
          node <<'NODE'
          const {execFileSync}=require("node:child_process");
          const run=args=>execFileSync(process.execPath,["node_modules/convex/bin/main.js",...args],{encoding:"utf8",stdio:["ignore","pipe","pipe"],timeout:30000,maxBuffer:1048576}).trim();
          (async()=>{let phase="target";try{
            if(run(["dashboard","--no-open"]).match(/https:\/\/dashboard\.convex\.dev\/d\/([a-z0-9-]+)/)?.[1]!=="woozy-wren-368")throw Error();
            phase="configuration";
            const names=new Set(run(["env","list","--names-only"]).split(/\r?\n/));
            const required=["OPENAI_API_KEY","OPENROUTER_API_KEY","JWT_PRIVATE_KEY","JWKS","AUTH_RESEND_KEY","AUTH_EMAIL_FROM","SITE_URL"];
            const missing=required.filter(name=>!names.has(name));
            const {ENV_MANIFEST,missingEnv}=await import("./convex/lib/env.ts");
            const fixtureValues=new Map();
            for(const spec of ENV_MANIFEST.filter(spec=>spec.tier==="fixture"))if(names.has(spec.name))fixtureValues.set(spec.name,run(["env","get",spec.name]));
            const active=missingEnv(name=>fixtureValues.get(name)).fixturesActive;
            console.log(JSON.stringify({stagingTarget:true,missingConfigurationNames:missing,activeFixtureNames:active}));
            if(missing.length||active.length)throw Error();
            const origin="https://pikar-ai-convex-gpbrsadzc-joelferuzi-gmailcoms-projects.vercel.app";
            if(new URL(run(["env","get","SITE_URL"])).origin!==origin)throw Error();
            phase="skill-registry";
            const requiredSkills=["foundation-voice","business-profile","onboarding-agent","voice-session","document-analyst","graph-extractor","document-classifier"];
            const source='const names='+JSON.stringify(requiredSkills)+';return (await Promise.all(names.map(name=>ctx.db.query("skills").withIndex("by_name_status",q=>q.eq("name",name).eq("status","active")).unique()))).every(row=>row!==null);';
            if(JSON.parse(run(["run","--inline-query",source]))!==true)throw Error();
            phase="queue-recheck";
            const query='const workEmpty=(await ctx.db.query("work").first())===null;const state=await ctx.db.query("internalState").first();return workEmpty&&(state===null||(Array.isArray(state.running)&&state.running.length===0));';
            for(const component of ["workflow/workpool","vaultIngestPool"])if(JSON.parse(run(["run","--inline-query",query,"--component",component]))!==true)throw Error();
            phase="enable-staging-foundation";
            run(["env","set","FOUNDATION_ONBOARDING_ENABLED","1"]);
            if(run(["env","get","FOUNDATION_ONBOARDING_ENABLED"])!=="1")throw Error();
            console.log(JSON.stringify({stagingPrerequisitesVerified:true,requiredSkillsActive:true,ingestionPoolsQuiet:true,foundationEnabled:true,productionUntouched:true,voiceActivationChanged:false,billingActivationChanged:false}));
          }catch{console.error("Staging prerequisite check stopped in phase: "+phase+"; private output suppressed.");process.exitCode=1;}})();
          NODE
